<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Mori - Sin conexión</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: #f5f0e1;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 0.3em;
      margin-bottom: 1rem;
      font-weight: normal;
    }
    p {
      color: #8a8578;
      margin-bottom: 2rem;
    }
    .divider {
      width: 60px;
      height: 1px;
      background-color: #1a1a1a;
      margin: 2rem 0;
    }
    button {
      padding: 0.75rem 2rem;
      background-color: #1a1a1a;
      color: #f5f0e1;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .quote {
      font-style: italic;
      color: #8a8578;
      margin-top: 2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>MEMENTO MORI</h1>
  <p>Recuerda que morirás</p>
  <div class="divider"></div>
  <p>Parece que no tienes conexión a internet.</p>
  <p>El tiempo sigue pasando, incluso offline.</p>
  <button onclick="window.location.reload()">Reintentar</button>
  <p class="quote">"El tiempo de la vida es corto; pasarlo miserablemente sería demasiado largo." - Shakespeare</p>
</body>
</html>
